name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Run unified audit
        env:
          OPENROUTER_API_KEY: test-key-for-ci
        run: bash scripts/audit.sh --ci

      - name: Build Python distributions
        run: python -m build --sdist --wheel

      - name: Security audit
        run: |
          pip install pip-audit
          # pip 26.0.1 is GitHub runner tooling; CVE-2026-3219 currently reports no fixed version.
          pip-audit --ignore-vuln GHSA-rf74-v2fm-23pw --ignore-vuln CVE-2026-33230 --ignore-vuln CVE-2026-33231 --ignore-vuln CVE-2026-3219
